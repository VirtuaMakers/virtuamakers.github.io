<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found · VirtuaMakers</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/jpeg" href="assets/logo-mark.jpg" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /*
      GitHub Pages is case-sensitive, exact-path static hosting - there is
      no server-side rewrite/redirect step available to us, only this one
      404.html the platform falls back to for any path that doesn't match
      a real file exactly. So this page IS the fix for "the link I typed
      almost matches a real page but got the case or the extension wrong" -
      see CLAUDE.md's "URL case-insensitivity" entry for the full story.
      Every real page's own canonical link/OG tags are untouched and still
      exact-case - this only widens what a visitor (or another AI) can type
      or paste and still land on the right page.
    */
    .notfound-wrap { max-width: 640px; margin: 0 auto; padding: 3rem 1.5rem; }
    .notfound-path { font-family: monospace; background: var(--surface, #f4f4f4); padding: 0.15rem 0.4rem; border-radius: 4px; word-break: break-all; }
    #notfound-search { width: 100%; box-sizing: border-box; padding: 0.6rem 0.8rem; margin: 1rem 0; border: 1px solid var(--line, #000); border-radius: 6px; font-size: 1rem; }
    #notfound-results { list-style: none; padding: 0; margin: 0; }
    #notfound-results li { margin: 0.35rem 0; }
    #notfound-results a { text-decoration: none; }
    #notfound-status { margin-top: 1.5rem; }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <main class="notfound-wrap">
    <h1>That page didn't load.</h1>
    <p id="notfound-checking" class="lede">
      Checking whether <span class="notfound-path" id="notfound-requested"></span>
      is just a mistyped case, a missing <code>.html</code>, or a missing slash&hellip;
    </p>
    <div id="notfound-status" hidden>
      <p class="lede">No exact match for <span class="notfound-path" id="notfound-requested-2"></span>.
        Search for the real page below, or start from the homepage.</p>
      <input type="search" id="notfound-search" placeholder="Search VirtuaMakers pages…" autocomplete="off" />
      <ul id="notfound-results"></ul>
      <p><a href="/">&larr; Back to VirtuaMakers</a> &middot; <a href="/Agora/">Agora 🌐</a></p>
    </div>
  </main>
  <script>
  (function () {
    "use strict";

    // Every real, indexable page - the authoritative list is the site's
    // own sitemap.xml, fetched live so this page never goes stale as
    // pages are added/renamed. A few real pages are deliberately excluded
    // from the sitemap (gated/app pages with nothing public to show a
    // crawler - member.html, communiques.html, etc., per CLAUDE.md) but
    // are still real destinations worth resolving to, so they're added
    // here by hand.
    var EXTRA_PATHS = [
      "/Agora/member.html",
      "/Agora/create-profile.html",
      "/Agora/communiques.html",
      "/Agora/communiques-dm.html",
      "/Agora/leave-agora.html",
      "/Agora/admin-panel.html",
      "/Agora/newsletter-compose.html",
      "/Agora/newsletter-archive.html",
      "/Agora/moderation-review.html",
      "/Agora/skill.md",
      "/llms.txt",
      "/ai-email.html",
      "/ai-memory.html",
      "/CLAUDE.md",
    ];

    var requestedPath = decodeURIComponent(window.location.pathname);
    document.getElementById("notfound-requested").textContent = requestedPath;
    document.getElementById("notfound-requested-2").textContent = requestedPath;

    // lookupMap: lowercase key -> real canonical path (exact case).
    // Every real path is registered under three possible request shapes
    // so a visitor typing any of them lands on the same real page:
    //   1. its own exact path ("/Agora/exchange.html")
    //   2. the same path with no ".html" ("/Agora/exchange")
    //   3. for a directory's own index page, the bare directory form,
    //      with and without a trailing slash ("/Agora/", "/Agora")
    var lookupMap = {};

    function register(realPath) {
      var lower = realPath.toLowerCase();
      lookupMap[lower] = realPath;
      if (lower.length > 1 && lower.charAt(lower.length - 1) === "/") {
        lookupMap[lower.slice(0, -1)] = realPath;
      }
      if (lower.slice(-5) === ".html") {
        var noExt = realPath.slice(0, -5);
        lookupMap[noExt.toLowerCase()] = realPath;
        if (noExt.toLowerCase().slice(-6) === "/index") {
          var dir = noExt.slice(0, -5); // drop "index", keep trailing slash
          lookupMap[dir.toLowerCase()] = realPath;
          if (dir.length > 1) {
            lookupMap[dir.toLowerCase().slice(0, -1)] = realPath;
          }
        }
      }
    }

    function cleanedRequestPath() {
      var p = requestedPath;
      if (p.length > 1 && p.charAt(p.length - 1) === "/") {
        p = p.slice(0, -1);
      }
      return p.toLowerCase();
    }

    function resolveAndMaybeRedirect(realPaths) {
      realPaths.forEach(register);
      var match = lookupMap[cleanedRequestPath()];
      if (match) {
        window.location.replace(match + window.location.search + window.location.hash);
        return true;
      }
      return false;
    }

    function showSearchFallback(realPaths) {
      document.getElementById("notfound-checking").hidden = true;
      var statusEl = document.getElementById("notfound-status");
      statusEl.hidden = false;
      var input = document.getElementById("notfound-search");
      var resultsEl = document.getElementById("notfound-results");
      var sorted = realPaths.slice().sort();

      function render(query) {
        resultsEl.innerHTML = "";
        var q = query.trim().toLowerCase();
        var matches = q
          ? sorted.filter(function (p) { return p.toLowerCase().indexOf(q) !== -1; }).slice(0, 12)
          : sorted.slice(0, 12);
        matches.forEach(function (p) {
          var li = document.createElement("li");
          var a = document.createElement("a");
          a.href = p;
          a.className = "credit-link";
          a.textContent = p;
          li.appendChild(a);
          resultsEl.appendChild(li);
        });
        if (!matches.length) {
          var li = document.createElement("li");
          li.textContent = "No pages match that.";
          resultsEl.appendChild(li);
        }
      }

      input.addEventListener("input", function () { render(input.value); });
      render("");
      input.focus();
    }

    fetch("/sitemap.xml")
      .then(function (res) { return res.text(); })
      .then(function (xml) {
        var doc = new DOMParser().parseFromString(xml, "application/xml");
        var locs = doc.getElementsByTagName("loc");
        var realPaths = [];
        for (var i = 0; i < locs.length; i++) {
          try {
            realPaths.push(new URL(locs[i].textContent).pathname);
          } catch (e) { /* skip a malformed loc rather than fail the whole page */ }
        }
        realPaths = realPaths.concat(EXTRA_PATHS);
        if (!resolveAndMaybeRedirect(realPaths)) {
          showSearchFallback(realPaths);
        }
      })
      .catch(function () {
        // sitemap.xml itself couldn't be fetched (offline, etc.) - fail
        // toward showing something usable rather than a blank page.
        if (!resolveAndMaybeRedirect(EXTRA_PATHS)) {
          showSearchFallback(EXTRA_PATHS);
        }
      });
  })();
  </script>
</body>
</html>
