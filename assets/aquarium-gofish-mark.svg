<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Aquarium GoFish logo – an albino angelfish swimming past coral and seaweed inside a circular badge">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fe0f7"/>
      <stop offset="100%" stop-color="#0d6dab"/>
    </linearGradient>
    <linearGradient id="fishBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f2eefb"/>
      <stop offset="100%" stop-color="#cfc8ea"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="216"/>
    </clipPath>
  </defs>

  <circle cx="256" cy="256" r="228" fill="#ffffff"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#0b1f3a" stroke-width="10"/>

  <g clip-path="url(#circleClip)">
    <rect x="0" y="0" width="512" height="512" fill="url(#water)"/>

    <g stroke="#ffffff" stroke-opacity="0.55" fill="none" stroke-width="4">
      <path d="M40 150 q40 -18 80 0 t80 0 t80 0 t80 0 t80 0"/>
    </g>

    <g fill="none" stroke="#2e7d32" stroke-linecap="round">
      <path d="M110 470 C 100 420, 130 400, 108 350" stroke-width="12"/>
      <path d="M138 472 C 150 430, 118 400, 140 360" stroke-width="10"/>
      <path d="M84 472 C 78 430, 100 410, 86 372" stroke-width="9"/>
    </g>

    <g transform="translate(372,460)">
      <g stroke="#ff7a3d" stroke-width="13" stroke-linecap="round" fill="none">
        <path d="M0 0 Q -14 -46 -6 -84"/>
        <path d="M0 0 Q 12 -40 6 -78"/>
        <path d="M0 0 Q 30 -30 34 -64"/>
        <path d="M0 0 Q -30 -24 -40 -52"/>
      </g>
      <g fill="#ff5fa2">
        <circle cx="-10" cy="-58" r="11"/>
        <circle cx="8" cy="-52" r="9"/>
        <circle cx="-2" cy="-82" r="8"/>
        <circle cx="30" cy="-66" r="8"/>
      </g>
    </g>

    <circle cx="120" cy="200" r="6" fill="#ffffff" fill-opacity="0.6"/>
    <circle cx="150" cy="150" r="4" fill="#ffffff" fill-opacity="0.6"/>
    <circle cx="330" cy="130" r="5" fill="#ffffff" fill-opacity="0.6"/>

    <g transform="translate(266,266) rotate(-6)">
      <path d="M0 -128 C 74 -80 74 80 0 128 C -74 80 -74 -80 0 -128 Z" fill="url(#fishBody)" stroke="#a89fce" stroke-width="2"/>
      <path d="M-66 0 L -140 -46 L -112 0 L -140 46 Z" fill="#ded7f2"/>
      <circle cx="36" cy="-16" r="9" fill="#1a1a2e"/>
      <circle cx="33" cy="-19" r="3" fill="#ffffff"/>
