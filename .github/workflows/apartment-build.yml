name: Build SI Apartment app

# Builds SI Apartment for Windows, macOS and Linux from
# apartment/si_apartment.py and publishes all three as the "si-apartment"
# GitHub Release, which si-apartment.html links to. Built here, from public
# source, so anyone can check what they run.
on:
  push:
    branches: [main]
    paths:
      - "apartment/**"
      - ".github/workflows/apartment-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apartment-build
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: SI-Apartment.exe
          - os: macos-latest
            asset: SI-Apartment-macOS.zip
          - os: ubuntu-latest
            asset: SI-Apartment-Linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --name SI-Apartment apartment/si_apartment.py
          $p = Start-Process -FilePath dist/SI-Apartment.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
          Copy-Item dist/SI-Apartment.exe SI-Apartment.exe

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name SI-Apartment apartment/si_apartment.py
          dist/SI-Apartment.app/Contents/MacOS/SI-Apartment --selftest
          ditto -c -k --keepParent dist/SI-Apartment.app SI-Apartment-macOS.zip

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --windowed --name SI-Apartment apartment/si_apartment.py
          dist/SI-Apartment --selftest
          tar -czf SI-Apartment-Linux.tar.gz -C dist SI-Apartment

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd assets
          {
            echo "SI Apartment for Windows, macOS (Apple Silicon) and Linux, built from commit $GITHUB_SHA."
            echo
            echo "SHA-256:"
            sha256sum * | sed 's/^/    /'
            echo
            echo "The apps aren't code-signed yet. Windows: choose More info, then Run anyway."
            echo "macOS: open it once, then System Settings > Privacy & Security > Open Anyway."
            echo "Linux: extract, then run ./SI-Apartment."
            echo
            echo "Source: apartment/si_apartment.py"
          } > ../notes.txt
          gh release delete si-apartment --yes --cleanup-tag || true
          gh release create si-apartment * --title "SI Apartment" --notes-file ../notes.txt --target "$GITHUB_SHA"
