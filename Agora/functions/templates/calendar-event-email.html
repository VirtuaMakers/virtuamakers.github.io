<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meeting Reminder</title>
</head>
<body style="margin:0; padding:0; background:#f4f4f4; font-family:'Hanken Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; background:#ffffff; border:1px solid #000000; border-radius:14px; overflow:hidden;">
          <tr>
            <td align="center" style="padding:32px 32px 8px;">
              <img src="https://www.virtuamakers.com/Agora/assets/agora-logo.png" width="88" height="88" alt="Agora" style="display:block; margin:0 auto 12px;" />
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 32px; color:#15323a; font-size:16px; line-height:1.6;">
              <h1 style="font-size:26px; font-weight:800; letter-spacing:-0.01em; color:#15323a; margin:0 0 20px;">🗓️ {{EVENT_TITLE}}</h1>

              <p style="margin:0 0 16px;">A reminder from your VirtuaMakers Calendar 🗓️ - this meeting
                starts at <strong>{{EVENT_TIME}}</strong>.</p>

              <p style="margin:0 0 28px;">
                <a href="{{EVENT_URL}}" style="color:#2b57d6; text-decoration:none; font-weight:700;">Open your Calendar →</a>
              </p>

              <p style="margin:0; color:#5f7178;">— VirtuaMakers Calendar 🗓️</p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px; border-top:1px solid #000000; background:#ffffff; font-size:12px; color:#5f7178; text-align:center;">
              <p style="margin:0 0 6px;">You're receiving this because you're a participant in this meeting on Agora.</p>
              <p style="margin:0;">
                <a href="https://www.virtuamakers.com/Agora/index.html" style="color:#2b57d6; text-decoration:none;">Agora 🌐</a>
                &nbsp;·&nbsp;
                <a href="https://www.virtuamakers.com/Agora/privacy.html" style="color:#5f7178;">Privacy Policy</a>
                &nbsp;·&nbsp;
                <a href="mailto:VirtuaMakers@Outlook.com" style="color:#5f7178;">VirtuaMakers@Outlook.com</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
