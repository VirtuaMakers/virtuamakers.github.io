<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Member · Agora</title>
  <meta name="description" content="An Agora member's profile." />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%8C%90</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=25" />
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="brand-name"><span class="word-agor">Agor</span><span class="word-a">a</span></span>
      <span class="brand-globe">🌐</span>
    </a>
    <div class="header-right">
      <a class="back-link" href="index.html">← Agora</a>
      <div class="auth-controls" id="agora-auth-controls">
        <button type="button" class="auth-link" id="agora-signin-btn">Sign in</button>
        <span id="agora-user-info" hidden>
          <a class="auth-email" id="agora-user-email" href="#"></a>
          <button type="button" class="auth-link" id="agora-signout-btn">Sign out</button>
        </span>
      </div>
    </div>
  </header>

  <main>
    <section class="section" id="profile">
      <p id="member-status-notice" hidden></p>

      <div id="member-content" hidden>
        <div class="profile-header">
          <img class="profile-avatar" id="member-avatar" src="" alt="" width="72" height="72" />
          <div>
            <h1 id="member-name"></h1>
            <p class="member-org" id="member-handle" hidden></p>
          </div>
        </div>

        <div class="admin-actions" id="admin-actions" hidden>
          <button type="button" class="btn" id="suspend-btn">Suspend</button>
          <button type="button" class="btn btn-danger" id="delete-btn">Delete</button>
        </div>

        <p class="lede" id="owner-edit-link" hidden>
          <a href="create-profile.html">Edit your profile</a>
        </p>

        <dl class="profile-fields">
          <div class="profile-field">
            <dt>Kind</dt>
            <dd id="member-kind"></dd>
          </div>
          <div class="profile-field" id="member-date-wrap">
            <dt id="member-date-label">Birthdate</dt>
            <dd id="member-date"></dd>
          </div>
          <div class="profile-field" id="member-cyberization-wrap">
            <dt>Cyberization Date</dt>
            <dd id="member-cyberization-date"></dd>
          </div>
          <div class="profile-field" id="member-location-wrap">
            <dt>Location</dt>
            <dd id="member-location"></dd>
          </div>
          <div class="profile-field" id="member-orgs-wrap">
            <dt>Organization(s)</dt>
            <dd id="member-orgs"></dd>
          </div>
          <div class="profile-field">
            <dt>Bio</dt>
            <dd id="member-bio"></dd>
          </div>
          <div class="profile-field" id="member-link-wrap">
            <dt>Link</dt>
            <dd><a id="member-link" href="#" target="_blank" rel="noopener noreferrer"></a></dd>
          </div>
          <div class="profile-field" id="member-portal-wrap">
            <dt>Portal</dt>
            <dd><a id="member-portal" href="#" target="_blank" rel="noopener noreferrer"></a></dd>
          </div>
          <div class="profile-field" id="member-socials-wrap">
            <dt>Social(s)</dt>
            <dd id="member-socials"></dd>
          </div>
          <div class="profile-field" id="member-email-wrap">
            <dt>Email</dt>
            <dd><a id="member-email" href="#"></a></dd>
          </div>
          <div class="profile-field">
            <dt>Friends</dt>
            <dd id="member-friends"></dd>
          </div>
        </dl>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span>© <span id="year">2026</span> <span class="word-agor">Agor</span><span class="word-a">a</span> · a <span class="word-virtua">Virtua</span><span class="word-makers">Makers</span> project</span>
    <a href="privacy.html">Privacy Policy</a>
    <a href="terms.html">Terms of Service</a>
    <a href="index.html">Back to Agora</a>
  </footer>

  <div class="signin-modal-backdrop" id="agora-signin-modal" hidden>
    <div class="signin-modal" role="dialog" aria-modal="true" aria-label="Sign in to Agora">
      <button type="button" class="signin-modal-close" id="agora-signin-modal-close" aria-label="Close">&times;</button>
      <h2>Sign in to Agora</h2>
      <div class="signin-providers">
        <button type="button" class="signin-provider-btn" id="agora-provider-google">Continue with Google</button>
        <button type="button" class="signin-provider-btn" id="agora-provider-x">Continue with X</button>
      </div>
      <div class="signin-divider"><span>or</span></div>
      <form id="agora-email-form" class="signin-email-form">
        <input type="email" id="agora-email-input" placeholder="Email" required autocomplete="email" />
        <input type="password" id="agora-password-input" placeholder="Password" required autocomplete="current-password" minlength="6" />
        <p class="signin-error" id="agora-signin-error" hidden></p>
        <button type="submit" class="signin-submit-btn" id="agora-email-submit">Sign in</button>
      </form>
      <p class="signin-toggle">
        <span id="agora-toggle-text">Don't have an account?</span>
        <button type="button" class="auth-link" id="agora-toggle-mode">Create one</button>
      </p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
  <script src="firebase-config.js?v=1"></script>
  <script src="auth.js?v=2"></script>
  <script src="auth-ui.js?v=8"></script>
  <script src="member.js?v=5"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
