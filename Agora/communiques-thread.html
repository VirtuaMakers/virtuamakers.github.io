<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thread · Communiqués · Agora</title>
  <meta name="description" content="A Communiqués discussion thread on Agora." />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%8C%90</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=38" />
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <header class="site-header">
    <div class="brand-group">
      <a class="brand" href="index.html">
        <span class="brand-name"><span class="word-agor">Agor</span><span class="word-a">a</span></span>
        <span class="brand-globe">🌐</span>
      </a>
      <span class="header-welcome" id="agora-user-info" hidden>Welcome, <a class="auth-email" id="agora-user-email" href="#"></a>!</span>
    </div>
    <div class="header-right">
      <a class="back-link" href="communiques.html">← Communiqués</a>
      <div class="auth-controls" id="agora-auth-controls">
        <button type="button" class="auth-link" id="agora-signin-btn">Sign in</button>
        <button type="button" class="auth-link" id="agora-signout-btn" hidden>Sign out</button>
      </div>
    </div>
  </header>

  <main>
    <section class="section" id="thread">
      <p id="thread-notice" hidden></p>

      <div id="thread-content" hidden>
        <h1 id="thread-title"></h1>
        <p class="thread-item-meta" id="thread-meta"></p>
        <p class="body-text thread-body" id="thread-body"></p>
        <button type="button" class="edit-toggle" id="thread-edit-toggle" hidden>Edit</button>
        <form class="profile-form edit-form" id="thread-edit-form" hidden>
          <div>
            <label for="thread-edit-title">Title</label>
            <input type="text" id="thread-edit-title" maxlength="200" required />
          </div>
          <div>
            <label for="thread-edit-body">Message</label>
            <textarea id="thread-edit-body" maxlength="9999" required></textarea>
          </div>
          <p class="form-error" id="thread-edit-error" hidden></p>
          <div class="profile-form-actions">
            <button type="submit" class="btn btn-primary" id="thread-edit-save">Save</button>
            <button type="button" class="btn" id="thread-edit-cancel">Cancel</button>
          </div>
        </form>

        <h2 class="section-title" id="replies-title">Replies</h2>
        <p class="intro" id="replies-empty" hidden>No replies yet.</p>
        <div class="reply-list" id="reply-list"></div>

        <p class="body-text" id="reply-signed-out-notice">
          <a href="#" id="reply-signin-prompt">Sign in</a> to reply.
        </p>
        <form class="profile-form" id="reply-form" hidden>
          <div>
            <label for="reply-body">Reply</label>
            <textarea id="reply-body" maxlength="9999" required></textarea>
            <p class="field-hint" id="reply-body-hint"></p>
          </div>
          <p class="form-error" id="reply-error" hidden></p>
          <div class="profile-form-actions">
            <button type="submit" class="btn btn-primary" id="reply-submit">Post Reply</button>
            <span class="form-status" id="reply-status" hidden>Posting…</span>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span>© <span id="year">2026</span> <span class="word-agor">Agor</span><span class="word-a">a</span> · a <span class="word-virtua">Virtua</span><span class="word-makers">Makers</span> project</span>
    <a href="privacy.html">Privacy Policy</a>
    <a href="terms.html">Terms of Service</a>
    <a href="index.html">Back to Agora</a>
  </footer>

  <div class="signin-modal-backdrop" id="agora-signin-modal" hidden>
    <div class="signin-modal" role="dialog" aria-modal="true" aria-label="Sign in to Agora">
      <button type="button" class="signin-modal-close" id="agora-signin-modal-close" aria-label="Close">&times;</button>
      <h2>Sign in to Agora</h2>
      <div class="signin-providers">
        <button type="button" class="signin-provider-btn" id="agora-provider-google">Continue with Google</button>
        <button type="button" class="signin-provider-btn" id="agora-provider-x">Continue with X</button>
      </div>
      <div class="signin-divider"><span>or</span></div>
      <form id="agora-email-form" class="signin-email-form">
        <input type="email" id="agora-email-input" placeholder="Email" required autocomplete="email" />
        <input type="password" id="agora-password-input" placeholder="Password" required autocomplete="current-password" minlength="6" />
        <p class="signin-error" id="agora-signin-error" hidden></p>
        <button type="submit" class="signin-submit-btn" id="agora-email-submit">Sign in</button>
      </form>
      <p class="signin-toggle">
        <span id="agora-toggle-text">Don't have an account?</span>
        <button type="button" class="auth-link" id="agora-toggle-mode">Create one</button>
      </p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js?v=1"></script>
  <script src="auth.js?v=2"></script>
  <script src="auth-ui.js?v=10"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="bio-tags.js?v=1"></script>
  <script src="communiques-common.js?v=1"></script>
  <script src="communiques-thread.js?v=2"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
